name: dependency-diff

on:
  pull_request:

jobs:
  diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: e18e/action-dependency-diff@d3eb8eefcbecc101135419a851cb51e1cdf58508 # v1.7.0
